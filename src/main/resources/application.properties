spring.application.name=gymflow

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

usda.api.key=${USDA_API_KEY}
usda.api.url=https://api.nal.usda.gov/fdc/v1/foods/search
usda.api.detail.url=https://api.nal.usda.gov/fdc/v1/food

server.port=${PORT:8080}